<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f8f9ff" />
  <title>Pulse</title>
  <link rel="icon" href="/logo.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300..600,0..1,0&display=block" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <!-- Side navigation: tablet and desktop -->
  <aside class="sidenav" aria-label="Main">
    <a class="sidenav-brand" href="#/briefing">
      <img src="/logo.svg" alt="" width="36" height="36" />
      <span><b>Pulse</b><small>Intelligence</small></span>
    </a>
    <nav class="sidenav-links" data-nav></nav>
  </aside>

  <header class="topbar" id="topbar">
    <div class="topbar-inner">
      <button class="icon-btn back" id="back" aria-label="Back" hidden><span class="ms">arrow_back</span></button>
      <a class="brand" href="#/briefing" id="brand">
        <img src="/logo.svg" alt="" width="32" height="32" />
        <span><b>Pulse</b><small id="section-label">Briefing</small></span>
      </a>
      <div class="topbar-title" id="topbar-title" hidden></div>
      <div class="topbar-actions">
        <button class="icon-btn" id="search-btn" aria-label="Search"><span class="ms">search</span></button>
        <button class="icon-btn" id="refresh-btn" aria-label="Refresh briefing"><span class="ms">sync</span></button>
        <button class="icon-btn" id="share-btn" aria-label="Open original source" hidden><span class="ms">open_in_new</span></button>
      </div>
    </div>
  </header>

  <main id="view" class="view"></main>

  <!-- Bottom dock: mobile -->
  <div class="dock-wrap"><nav class="dock" aria-label="Main" data-nav></nav></div>

  <script src="/app.js" type="module"></script>
</body>
</html>
